# Routes :5000 to the Patroni primary only. Patroni's REST API answers
# 200 on /primary for the leader and 503 everywhere else.
global
    maxconn 256

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s

defaults
    mode tcp
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    timeout check 2s

listen stats
    mode http
    bind :7000
    stats enable
    stats uri /

listen primary
    bind :5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008
    server pg-3 pg-3:5432 check port 8008
