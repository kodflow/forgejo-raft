# End-to-end suite of the cluster: a real three-node forgejo-raft cluster,
# brought up by the lab (contrib/cluster-lab) under Docker Compose on the
# runner, checked through its HTTP API, git and the cluster CLI.
#
# - images: the Forgejo image (the repository's Dockerfile, target
#   forgejo) and the lab's Patroni image, built once with the gha cache and
#   handed to the suites as an artifact.
# - one job per suite, each on its own lab, laid out by compose.ci.yaml
#   (autonomous formation, consensus on its own network, shared storage,
#   SSH, a webhook receiver):
#     cluster   A. formation and B. Raft behaviour (scripts/ci/cluster.sh)
#     features  C. Forgejo's features node to node (scripts/ci/features.sh)
#     observer  D. checkpoints and the observer (scripts/ci/observer.sh), on
#               the lab's manual bootstrap and compose.observer.yaml
#   Every checkpoint prints `CHECK <name>: PASS|FAIL`; a FAIL fails the job.
#   The logs of every container are uploaded when a job fails; the lab is
#   torn down (`docker compose down -v`) whatever happens.
name: E2E

on:
  pull_request:
    branches: [forgejo]
  push:
    branches: [forgejo]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: forgejo-cluster-lab
  LAB: contrib/cluster-lab

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Makefile names the build after `git describe`; .dockerignore
      # keeps VERSION out of the image's context, and a checkout has no
      # tags, so describe would print a bare commit hash, which Forgejo's
      # migrations refuse as a version. A tag in the runner only, never
      # pushed, gives it a valid one.
      - name: Version
        run: |
          git tag v0.0.0-e2e
          echo "E2E_VERSION=0.0.0-e2e+gitea-1.22.0" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Forgejo image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: forgejo
          platforms: linux/amd64
          build-args: RELEASE_VERSION=${{ env.E2E_VERSION }}
          tags: forgejo-cluster-lab/forgejo:raft-cluster
          outputs: type=docker,dest=${{ runner.temp }}/images/forgejo.tar
          cache-from: type=gha,scope=e2e-forgejo
          cache-to: type=gha,scope=e2e-forgejo,mode=max

      - name: Patroni image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.LAB }}/patroni
          platforms: linux/amd64
          tags: forgejo-cluster-lab/patroni:4.1.5-pg18
          outputs: type=docker,dest=${{ runner.temp }}/images/patroni.tar
          cache-from: type=gha,scope=e2e-patroni
          cache-to: type=gha,scope=e2e-patroni,mode=max

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-images
          path: ${{ runner.temp }}/images
          retention-days: 1
          compression-level: 1

  suite:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [cluster, features]
    name: ${{ matrix.suite }}
    env:
      COMPOSE_FILE: ${{ github.workspace }}/contrib/cluster-lab/compose.yaml:${{ github.workspace }}/contrib/cluster-lab/compose.ci.yaml
      # compose.yaml names the Forgejo build context; the image is loaded,
      # never built here.
      FORGEJO_SRC: ${{ github.workspace }}
      FORGEJO_DOCKERFILE: Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-images
          path: ${{ runner.temp }}/images

      - name: Load the images
        run: |
          for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done
          rm -rf "$RUNNER_TEMP/images"

      - name: Bring the lab up
        working-directory: ${{ env.LAB }}
        run: |
          set -euo pipefail
          scripts/secrets.sh
          mkdir -p .build
          docker compose config --quiet
          docker compose up -d --no-build --wait --wait-timeout 300 \
            consul-1 consul-2 consul-3 pg-1 pg-2 pg-3 haproxy
          # No --wait: the one-shot pki and shared-init exit, and the
          # suite itself checks that the nodes become ready.
          docker compose up -d --no-build forgejo-1 forgejo-2 forgejo-3 receiver
          docker compose ps -a

      - name: Suite ${{ matrix.suite }}
        working-directory: ${{ env.LAB }}
        run: |
          set -o pipefail
          bash "scripts/ci/${{ matrix.suite }}.sh" 2>&1 | tee ".build/${{ matrix.suite }}.log"

      - name: Checkpoints
        if: always()
        working-directory: ${{ env.LAB }}
        run: |
          {
            echo "### ${{ matrix.suite }}"
            echo '```text'
            cat .build/checks.txt 2>/dev/null || echo "no checkpoint ran"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test -s .build/checks.txt
          ! grep -q ': FAIL' .build/checks.txt

      - name: Collect the logs
        if: failure()
        working-directory: ${{ env.LAB }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp .build/*.log .build/checks.txt "$RUNNER_TEMP/logs/" 2>/dev/null || true
          docker compose ps -a > "$RUNNER_TEMP/logs/ps.txt" 2>&1 || true
          docker compose ps -a --services | while IFS= read -r s; do
            docker compose logs --no-color --timestamps "$s" > "$RUNNER_TEMP/logs/$s.log" 2>&1 || true
          done
          for n in 1 2 3; do
            docker compose exec -T -u git "forgejo-$n" /usr/local/bin/gitea cluster status \
              > "$RUNNER_TEMP/logs/cluster-status-$n.txt" 2>&1 || true
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs-${{ matrix.suite }}
          path: ${{ runner.temp }}/logs
          retention-days: 7

      - name: Tear down
        if: always()
        working-directory: ${{ env.LAB }}
        run: docker compose down -v --remove-orphans --timeout 5

  # Suite D, on its own lab: the manual bootstrap, then compose.observer.yaml.
  observer:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORGEJO_SRC: ${{ github.workspace }}
      FORGEJO_DOCKERFILE: Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-images
          path: ${{ runner.temp }}/images

      - name: Load the images
        run: |
          for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done
          rm -rf "$RUNNER_TEMP/images"

      - name: Bring the lab up and found the cluster
        working-directory: ${{ env.LAB }}
        run: |
          set -euo pipefail
          scripts/secrets.sh
          mkdir -p .build
          docker compose up -d --no-build --wait --wait-timeout 300 \
            consul-1 consul-2 consul-3 pg-1 pg-2 pg-3 haproxy
          docker compose up -d --no-build forgejo-1 forgejo-2 forgejo-3
          scripts/bootstrap.sh

      - name: Suite observer
        working-directory: ${{ env.LAB }}
        run: |
          set -o pipefail
          bash scripts/ci/observer.sh 2>&1 | tee .build/observer.log

      - name: Checkpoints
        if: always()
        working-directory: ${{ env.LAB }}
        run: |
          {
            echo "### observer"
            echo '```text'
            cat .build/checks.txt 2>/dev/null || echo "no checkpoint ran"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test -s .build/checks.txt
          ! grep -q ': FAIL' .build/checks.txt

      - name: Collect the logs
        if: failure()
        working-directory: ${{ env.LAB }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp .build/*.log .build/*.txt "$RUNNER_TEMP/logs/" 2>/dev/null || true
          dco() { docker compose -f compose.yaml -f compose.observer.yaml --profile observer --profile recover "$@"; }
          dco ps -a > "$RUNNER_TEMP/logs/ps.txt" 2>&1 || true
          dco ps -a --services | while IFS= read -r s; do
            dco logs --no-color --timestamps "$s" > "$RUNNER_TEMP/logs/$s.log" 2>&1 || true
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs-observer
          path: ${{ runner.temp }}/logs
          retention-days: 7

      - name: Tear down
        if: always()
        working-directory: ${{ env.LAB }}
        run: docker compose -f compose.yaml -f compose.observer.yaml --profile observer --profile recover down -v --remove-orphans --timeout 5
