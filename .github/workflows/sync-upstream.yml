# Brings Codeberg's forgejo/forgejo into this repository's `forgejo` branch,
# through a pull request that merges itself once post-commit and
# cluster-checks are green.
#
# - Daily and on demand: merge codeberg.org/forgejo/forgejo `forgejo` into the
#   branch `sync/upstream`, with a merge commit by github-actions[bot], push
#   it, and open or update the PR sync/upstream -> forgejo with auto-merge on
#   (merge commit, never squash or rebase, so upstream's commits become
#   ancestors of `forgejo`). `forgejo` itself is never pushed: its rulesets
#   require the post-commit and cluster-checks statuses and refuse
#   non-fast-forward pushes.
# - sync/upstream is only ever pushed fast-forward. Once its last PR is
#   merged it is an ancestor of `forgejo` and starts again from there; while a
#   PR is still open, `forgejo` is merged into it first, then upstream.
# - A conflict in go.mod or go.sum alone is resolved three ways by
#   .github/scripts/gomodmerge (this fork's lines kept, upstream's bumps
#   taken), then go mod tidy rebuilds go.sum and every package must still
#   load. Git merges go.mod line by line, so an upstream bump next to a line
#   this fork added stopped the sync from 2026-10-19.
# - On any other conflict, a replace both sides changed differently, or when
#   upstream changes .github/workflows (a push the GITHUB_TOKEN may not make,
#   and where this repository's workflows live), the run fails and pushes
#   nothing.
#
# Tokens. A push or a PR made with the GITHUB_TOKEN starts no workflow, so
# post-commit and cluster-checks would never report on the PR and auto-merge
# would wait forever.
# Set the secret SYNC_TOKEN, a fine-grained token on this repository only with
# Contents and Pull requests read and write: the push, the PR and auto-merge
# then use it, and the checks run. Without it the PR is still opened with the
# GITHUB_TOKEN, which needs the setting "Allow GitHub Actions to create and
# approve pull requests", and a comment on it says how to start the checks.
# Auto-merge also needs the repository setting allow_auto_merge; without it
# the run warns and the PR waits for a manual merge.
name: Sync upstream

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Merge and report, push nothing, open no PR
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://codeberg.org/forgejo/forgejo.git
  UPSTREAM_BRANCH: forgejo
  BASE_BRANCH: forgejo
  SYNC_BRANCH: sync/upstream
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          # The push below authenticates with it: SYNC_TOKEN when set, so the
          # push starts the PR's checks.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      # gomodmerge and go mod tidy, for a go.mod or go.sum conflict.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Merge upstream into sync/upstream
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" 2>/dev/null || true

          # Settles a merge whose only conflicts are go.mod and go.sum; any
          # other conflicted path, or a failing step, leaves it to a human.
          resolve_gomod() {
            local f mod=false sum=false tmp
            while IFS= read -r f; do
              case "$f" in
                go.mod) mod=true ;;
                go.sum) sum=true ;;
                *) return 1 ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
            tmp="$(mktemp -d)"
            if [ "$mod" = true ]; then
              git show :1:go.mod > "$tmp/base" &&
                git show :2:go.mod > "$tmp/ours" &&
                git show :3:go.mod > "$tmp/theirs" &&
                (cd .github/scripts/gomodmerge &&
                  go run . "$tmp/base" "$tmp/ours" "$tmp/theirs") > "$tmp/go.mod" &&
                cp "$tmp/go.mod" go.mod || return 1
            fi
            if [ "$sum" = true ]; then
              # Both sides' checksums; tidy keeps only what the graph needs.
              { git show :2:go.sum; git show :3:go.sum; } | sort -u > go.sum || return 1
            fi
            go mod tidy && go list -deps ./... > /dev/null && git add go.mod go.sum
          }

          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          up="$(git rev-parse FETCH_HEAD)"
          base="origin/$BASE_BRANCH"
          sync="origin/$SYNC_BRANCH"

          # Start from forgejo, unless an unmerged sync/upstream is still open:
          # then build on it, so the push stays fast-forward.
          git checkout -q -B "$SYNC_BRANCH" "$base"
          if git rev-parse --quiet --verify "$sync" >/dev/null &&
            ! git merge-base --is-ancestor "$sync" "$base"; then
            git checkout -q -B "$SYNC_BRANCH" "$sync"
            if ! git merge-base --is-ancestor "$base" HEAD; then
              if ! git merge --no-edit --no-ff -m "Merge $BASE_BRANCH into $SYNC_BRANCH" "$base"; then
                echo "::error::$BASE_BRANCH does not merge cleanly into $SYNC_BRANCH; nothing was pushed. Conflicted files:"
                git diff --name-only --diff-filter=U
                git merge --abort
                exit 1
              fi
            fi
          fi

          if git merge-base --is-ancestor "$up" HEAD; then
            echo "$SYNC_BRANCH already contains upstream ${up:0:12}"
          else
            mb="$(git merge-base "$up" HEAD)"
            if ! git diff --quiet "$mb" "$up" -- .github/workflows; then
              echo "::error::upstream changes .github/workflows: the GITHUB_TOKEN may not push it, and our workflows live there. Merge by hand."
              git diff --stat "$mb" "$up" -- .github/workflows
              exit 1
            fi
            if ! git merge --no-edit --no-ff -m "Merge upstream forgejo/forgejo@${up:0:12}" "$up"; then
              if ! resolve_gomod; then
                echo "::error::upstream does not merge cleanly into $SYNC_BRANCH; nothing was pushed. Conflicted files:"
                git diff --name-only --diff-filter=U
                git merge --abort
                exit 1
              fi
              git commit --no-edit -q
              echo "go.mod and go.sum merged three ways and tidied"
            fi
            echo "merged $(git rev-list --count "$mb..$up") upstream commits, up to ${up:0:12}"
          fi

          ahead="$(git rev-list --count "$base..HEAD")"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "upstream=${up:0:12}" >> "$GITHUB_OUTPUT"
          if [ "$ahead" = 0 ]; then
            echo "$BASE_BRANCH already contains upstream: nothing to offer"
            exit 0
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "dry run: $SYNC_BRANCH would be $ahead commits ahead of $BASE_BRANCH, not pushed"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"

      - name: Open or update the PR, with auto-merge
        if: ${{ steps.merge.outputs.ahead != '0' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          AHEAD: ${{ steps.merge.outputs.ahead }}
          UPSTREAM: ${{ steps.merge.outputs.upstream }}
        run: |
          set -euo pipefail
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "Mise à jour amont : \`$SYNC_BRANCH\` apporte $AHEAD commits à \`$BASE_BRANCH\`, jusqu'à forgejo/forgejo@$UPSTREAM." \
            "Ouverte et tenue à jour par le workflow Sync upstream. Elle se fusionne seule (auto-merge, commit de fusion) une fois post-commit et cluster-checks au vert." \
            "**Fusionner par un commit de fusion**, jamais par squash ou rebase, pour que les commits amont deviennent des ancêtres de \`$BASE_BRANCH\`.")"
          # --head matches a branch name only: a fork's sync/upstream would
          # match too, so only this repository's own head is kept.
          pr="$(gh pr list -R "$REPO" --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --state open \
            --json number,isCrossRepository -q '[.[] | select(.isCrossRepository | not)][0].number // empty')"
          created=false
          if [ -n "$pr" ]; then
            gh pr edit "$pr" -R "$REPO" --body "$body"
            echo "updated PR #$pr ($AHEAD commits ahead)"
          else
            url="$(gh pr create -R "$REPO" --base "$BASE_BRANCH" --head "$SYNC_BRANCH" \
              --title "chore: forgejo amont ($UPSTREAM)" --body "$body")"
            pr="${url##*/}"
            created=true
            echo "opened PR #$pr"
          fi
          if ! gh pr merge "$pr" -R "$REPO" --auto --merge; then
            echo "::warning::auto-merge could not be enabled on PR #$pr (repository setting allow_auto_merge?): it waits for a manual merge."
          fi
          if [ "$HAS_SYNC_TOKEN" != true ] && [ "$created" = true ]; then
            gh pr comment "$pr" -R "$REPO" --body "Ouverte avec le GITHUB_TOKEN : les contrôles ne démarrent pas seuls (ou attendent une approbation, bouton « Approve workflows to run » de la PR), donc post-commit ne rend pas de statut et l'auto-merge attend. Pour les lancer, approuver les runs en attente s'il y en a, sinon pousser un commit sur \`$SYNC_BRANCH\` ou fermer puis rouvrir la PR. Pour que les prochaines synchros les lancent seules, fixer le secret SYNC_TOKEN (voir l'en-tête de .github/workflows/sync-upstream.yml)."
          fi
