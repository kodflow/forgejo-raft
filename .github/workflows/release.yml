# Cuts a release of forgejo-raft when cluster code lands on `forgejo`.
#
# Version: v<upstream>-raft.<N>, e.g. v18.0.0-dev-raft.1.
#   <upstream>  the upstream Forgejo version, taken as Forgejo's Makefile takes
#               it: git describe on the nearest upstream tag reachable from the
#               commit, `-test` tags excluded, leading v dropped. Upstream's
#               `forgejo` branch carries the development tag of its next major,
#               so this is X.0.0-dev until that changes. This repository holds
#               no upstream tags: they are read from Codeberg (ls-remote) and
#               created in the runner only, never pushed.
#   <N>         1 + the highest N already tagged here for that <upstream>.
#               A new upstream version starts again at 1.
# The binary reports <upstream>-raft.<N>+gitea-<compat>: the release tag is
# created in the runner before the build, so the Makefile's git describe
# yields it inside the image build (.git is in the build context; a VERSION
# file is not, Forgejo's .dockerignore excludes it). That tag is never pushed:
# the last step creates the real one.
#
# When: every push to `forgejo`, and on demand. A run releases only when the
# commit brings at least one non-merge commit that changes a released path
# (all but .github/, .coderabbit.yaml and contrib/cluster-lab/) and is in
# neither the previous release nor upstream's branch. Not a `paths:` filter:
# an upstream sync touches the same directories as the cluster (cmd/,
# modules/setting/, services/webhook/), and a filter would cut a release on
# every sync and none after a failed run. Comparing against the last tag and
# upstream also makes a failed release come back on the next push.
#
# Output: a tag and a GitHub Release with notes from the cluster commits since
# the previous tag, binaries and image: release-publish.yml, shared with the
# releases of official Forgejo versions (raft-release.yml). A development
# upstream version is published as a prerelease, image alias :dev.
#
# The decision lives in .github/scripts/release-plan.sh; run it locally with
# --dry-run to see what a push would do.
name: Release

on:
  push:
    branches: [forgejo]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the version and the notes, build and publish nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      file_version: ${{ steps.plan.outputs.file_version }}
      upstream_version: ${{ steps.plan.outputs.upstream_version }}
      sha: ${{ steps.plan.outputs.sha }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Offline, a few seconds: a wrong decision must stop the run, not cut
      # or miss a release.
      - name: Test the decision
        run: .github/scripts/release-plan.test.sh

      - name: Version and decision
        id: plan
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: .github/scripts/release-plan.sh

      - name: Notes
        id: notes
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          cat "$NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"
          delim="notes_$(openssl rand -hex 16)"
          {
            echo "notes<<$delim"
            cat "$NOTES_FILE"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' && !inputs.dry_run }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      file_version: ${{ needs.plan.outputs.file_version }}
      upstream_version: ${{ needs.plan.outputs.upstream_version }}
      sha: ${{ needs.plan.outputs.sha }}
      notes: ${{ needs.plan.outputs.notes }}
