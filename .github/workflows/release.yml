# Cuts a release of forgejo-raft when cluster code lands on `forgejo`.
#
# Version: v<upstream>-raft.<N>, e.g. v18.0.0-dev-raft.1.
#   <upstream>  the upstream Forgejo version, taken as Forgejo's Makefile takes
#               it: git describe on the nearest upstream tag reachable from the
#               commit, `-test` tags excluded, leading v dropped. Upstream's
#               `forgejo` branch carries the development tag of its next major,
#               so this is X.0.0-dev until that changes. This repository holds
#               no upstream tags: they are read from Codeberg (ls-remote) and
#               created in the runner only, never pushed.
#   <N>         1 + the highest N already tagged here for that <upstream>.
#               A new upstream version starts again at 1.
# The binary reports <upstream>-raft.<N>+gitea-<compat>: the release tag is
# created in the runner before the build, so the Makefile's git describe
# yields it inside the image build (.git is in the build context; a VERSION
# file is not, Forgejo's .dockerignore excludes it). That tag is never pushed:
# the last step creates the real one.
#
# When: every push to `forgejo`, and on demand. A run releases only when the
# commit brings at least one non-merge commit that changes a released path
# (all but .github/, .coderabbit.yaml and contrib/cluster-lab/) and is in
# neither the previous release nor upstream's branch. Not a `paths:` filter:
# an upstream sync touches the same directories as the cluster (cmd/,
# modules/setting/, services/webhook/), and a filter would cut a release on
# every sync and none after a failed run. Comparing against the last tag and
# upstream also makes a failed release come back on the next push.
#
# Output: a tag and a GitHub Release with notes from the cluster commits since
# the previous tag; forgejo binaries for linux/amd64 and linux/arm64 with
# SHA256SUMS; and ghcr.io/<owner>/forgejo-raft:<version> and :latest, built
# with Forgejo's own Dockerfile (bindata, timetzdata, sqlite,
# sqlite_unlock_notify, static). The binaries are the image's /app/gitea/gitea,
# exported from the same cached build, so release and image hold the same
# build. The tag is created last: a failed
# build tags nothing.
#
# The decision lives in .github/scripts/release-plan.sh; run it locally with
# --dry-run to see what a push would do.
name: Release

on:
  push:
    branches: [forgejo]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the version and the notes, build and publish nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      file_version: ${{ steps.plan.outputs.file_version }}
      upstream_version: ${{ steps.plan.outputs.upstream_version }}
      sha: ${{ steps.plan.outputs.sha }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Offline, a few seconds: a wrong decision must stop the run, not cut
      # or miss a release.
      - name: Test the decision
        run: .github/scripts/release-plan.test.sh

      - name: Version and decision
        id: plan
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: .github/scripts/release-plan.sh

      - name: Notes
        id: notes
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          cat "$NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"
          delim="notes_$(openssl rand -hex 16)"
          {
            echo "notes<<$delim"
            cat "$NOTES_FILE"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      FILE_VERSION: ${{ needs.plan.outputs.file_version }}
      UPSTREAM_VERSION: ${{ needs.plan.outputs.upstream_version }}
      SHA: ${{ needs.plan.outputs.sha }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # The checkout has no tags, and without one the Makefile's
      # `git describe --always` gives a bare commit hash, which Forgejo's
      # migrations refuse as a malformed version. Local only: never pushed.
      - name: Release tag, in the runner only
        run: |
          set -euo pipefail
          git tag "$VERSION" HEAD
          made=$(make -s show-version-full)
          echo "the Makefile derives $made"
          if [ "$made" != "$FILE_VERSION" ]; then
            echo "::error::the Makefile derives $made, not $FILE_VERSION" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: RELEASE_VERSION=${{ needs.plan.outputs.file_version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.plan.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.title=forgejo-raft
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      # The same build again, every layer from the cache the step above just
      # filled, exported as files instead of pulled back from the registry:
      # pulling one digest for two platforms into the runner's image store
      # fails ("cannot overwrite digest"). A multi-platform local export puts
      # each platform's root filesystem under its own directory.
      - name: Image filesystems, per platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: RELEASE_VERSION=${{ needs.plan.outputs.file_version }}
          outputs: type=local,dest=${{ runner.temp }}/rootfs
          cache-from: type=gha,scope=release

      - name: Binaries from the image
        env:
          ROOTFS: ${{ runner.temp }}/rootfs
        run: |
          set -euo pipefail
          mkdir dist
          for arch in amd64 arm64; do
            out="dist/forgejo-${VERSION#v}-linux-$arch"
            install -m 755 "$ROOTFS/linux_$arch/app/gitea/gitea" "$out"
          done
          # Both must start and report the version as their own, not only as
          # the release name. The arm64 one runs through the QEMU set up above.
          for arch in amd64 arm64; do
            bin="dist/forgejo-${VERSION#v}-linux-$arch"
            reported=$("$bin" --version)
            echo "$arch: $reported"
            case "$reported" in
              "forgejo version $FILE_VERSION "*) ;;
              *) echo "::error::$arch binary reports '$reported', not version $FILE_VERSION" >&2; exit 1 ;;
            esac
          done
          file "dist/forgejo-${VERSION#v}-linux-arm64" | tee /dev/stderr | grep -q 'ARM aarch64'
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' "$NOTES"
            printf 'Container image: %s%s:%s%s\n' '`' "$IMAGE" "$VERSION" '`'
          } > "$RUNNER_TEMP/notes.md"
          # A development upstream version is a prerelease upstream too.
          pre=()
          case "$UPSTREAM_VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${pre[@]}"
